<!DOCTYPE html>
<!-- Linguification CERTIFICATE — MOVED · Sep 19 2026
     This page used to hold the Linguification exam, with its answer key inside the page and grading in the
     browser, so anyone reading the source could earn a certificate. The exam now lives at
     https://www.globalsovereignuniversity.org/linguification-exam and is graded on the gsu-assess server.
     This page is kept (not deleted) so certificates ALREADY issued here, serials beginning GSU-LING,
     can still be verified: the box below reads the public registry (Firestore project
     gsu-certification, collection certifications) exactly as the old page did. It writes nothing.
     No questions and no answers are on this page. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linguification Certificate of Comprehension — moved | Global Sovereign University</title>
<link rel="canonical" href="https://www.globalsovereignuniversity.org/linguification-exam">
<style>
body{margin:0;background:#000;color:#F5F1E8;font-family:Georgia,'Times New Roman',serif}
.w{max-width:680px;margin:0 auto;padding:56px 22px 70px}
h1{font-size:2rem;font-weight:400;margin:0 0 14px}
p{line-height:1.7;color:#d8d2c4;margin:0 0 16px}
a.btn{display:inline-block;background:#C9A84C;color:#151005;font-family:Arial,sans-serif;font-weight:800;padding:14px 26px;border-radius:9px;text-decoration:none;margin:6px 0 30px}
.box{border:1px solid #3a352c;border-radius:12px;padding:20px;background:#070605}
.box label{display:block;font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#C9A84C;margin-bottom:9px}
.row{display:flex;gap:8px}
input{flex:1;background:#000;border:1px solid #3a352c;border-radius:8px;color:#F5F1E8;font-size:1rem;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace}
button{background:none;border:1px solid #C9A84C;color:#C9A84C;border-radius:8px;padding:10px 16px;font-family:Arial,sans-serif;cursor:pointer}
#out{margin-top:14px;font-family:Arial,sans-serif;font-size:.95rem;min-height:1.3em}
.ok{color:#9fd49f}.bad{color:#e0a3a3}
</style></head><body><div class="w">
<h1>The Linguification certificate has moved</h1>
<p>The exam is now graded on our server, so no answer key ever reaches your browser. It is still free, anonymous and open to anyone.</p>
<a class="btn" href="https://www.globalsovereignuniversity.org/linguification-exam">Take the Linguification exam</a>
<div class="box">
<label for="s">Verify a certificate issued on this page (serials beginning GSU-LING)</label>
<div class="row"><input id="s" placeholder="GSU-LING-XXXXXXX" autocomplete="off"><button id="go" type="button">Verify</button></div>
<div id="out" aria-live="polite"></div>
</div>
<p style="margin-top:22px;font-size:.9rem">Certificates from the new exam are verified on the certificate itself, by its link.</p>
</div>
<script>
(function(){
  var KEY='AIzaSyAmFycf1iMeISLzjWgbxnuSB1BJ3BuWB_U';
  var out=document.getElementById('out'), inp=document.getElementById('s');
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function val(f){if(!f)return '';return f.stringValue!=null?f.stringValue:(f.integerValue!=null?f.integerValue:(f.booleanValue!=null?f.booleanValue:''));}
  document.getElementById('go').onclick=function(){
    var s=(inp.value||'').trim().toUpperCase();
    if(!/^GSU-[A-Z0-9-]{3,40}$/.test(s)){out.innerHTML='<span class="bad">Enter a serial number.</span>';return;}
    out.textContent='Checking…';
    fetch('https://firestore.googleapis.com/v1/projects/gsu-certification/databases/(default)/documents/certifications/'+encodeURIComponent(s)+'?key='+KEY)
      .then(function(r){ if(r.status===404) return null; if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        if(!d){out.innerHTML='<span class="bad">&#10007; No certificate found with that serial.</span>';return;}
        var f=d.fields||{};
        if(val(f.revoked)===true){out.innerHTML='<span class="bad">&#10007; This certificate has been revoked and is no longer valid.</span>';return;}
        out.innerHTML='<span class="ok">&#10003; Valid.</span> '+esc(val(f.subject))+' · '+esc(val(f.tier))+' · '+esc(val(f.pct))+'% · '+esc(val(f.alias)||'Anonymous')+' · '+esc(new Date(val(f.dateISO)).toLocaleDateString());
      })
      .catch(function(){out.innerHTML='Verification is offline right now — try again when connected.';});
  };
})();
</script>
</body></html>
